<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pollinations Image Studio — free AI image generation</title>
<meta name="description" content="A free, no-key, in-browser AI image studio powered by Pollinations.ai. Pick a model (flux / zimage / klein / kontext), describe an image, get a result in seconds.">
<meta property="og:title" content="Pollinations Image Studio">
<meta property="og:description" content="Free AI image generation in your browser. Powered by Pollinations.ai (gen.pollinations.ai).">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f0f14;
    --panel: #1a1a23;
    --border: #2a2a36;
    --accent: #8a2be2;
    --accent-hover: #a44bff;
    --text: #e6e6ef;
    --muted: #8a8a99;
    --error: #ff6464;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 0.4rem;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    background: linear-gradient(90deg, #8a2be2, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 1.5rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.25rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  textarea, input[type="number"], select {
    width: 100%;
    background: #0a0a10;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.8rem;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color .15s;
  }
  textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.8rem;
    margin-top: 0.9rem;
  }
  button.generate {
    width: 100%;
    margin-top: 1rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.85rem;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button.generate:hover { background: var(--accent-hover); }
  button.generate:disabled { background: #444; cursor: not-allowed; }
  .result {
    text-align: center;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.8rem;
  }
  .result img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .result .placeholder { color: var(--muted); }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    color: var(--error);
    font-size: 0.95rem;
    word-break: break-word;
  }
  .meta {
    font-size: 0.8rem;
    color: var(--muted);
    word-break: break-all;
  }
  footer {
    padding: 1.5rem;
    text-align: center;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--accent-hover); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .badge { display: inline-block; margin: 0.4rem 0.3rem; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1>🌸 Pollinations Image Studio</h1>
  <p>Free AI image generation in your browser. No sign-up required to try.</p>
</header>

<main>
  <section class="panel">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="a calico cat surfing on a glowing wave at sunset, photorealistic">a calico cat surfing on a glowing wave at sunset, photorealistic</textarea>

    <div class="row">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="flux" selected>flux — photorealistic, versatile</option>
          <option value="zimage">zimage — artistic, stylized</option>
          <option value="klein">klein — fast, creative</option>
          <option value="kontext">kontext — context-aware</option>
        </select>
      </div>
      <div>
        <label for="width">Width</label>
        <input id="width" type="number" min="64" max="2048" step="64" value="1024">
      </div>
      <div>
        <label for="height">Height</label>
        <input id="height" type="number" min="64" max="2048" step="64" value="1024">
      </div>
    </div>

    <button id="go" class="generate">Generate ✨</button>
  </section>

  <section class="panel result" id="result">
    <p class="placeholder">Your image will appear here.</p>
  </section>
</main>

<footer>
  <a href="https://pollinations.ai" target="_blank" rel="noopener">
    <img class="badge" src="https://img.shields.io/badge/Built%20with-Pollinations-8a2be2?style=for-the-badge" alt="Built with Pollinations">
  </a>
  <br>
  <a href="arena/">🏟 Arena（多模型比較）</a>
  &nbsp;·&nbsp;
  <a href="tw-writer.html">✍️ TW Writer（繁中改寫）</a>
  &nbsp;·&nbsp;
  Powered by <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a>
  &nbsp;·&nbsp;
  <a href="https://github.com/housir2001/pollinations-image-demo" target="_blank" rel="noopener">Source on GitHub</a>
  &nbsp;·&nbsp;
  <a href="https://enter.pollinations.ai" target="_blank" rel="noopener">Get an API key</a>
</footer>

<script>
(function () {
  // Two endpoints, fail-open ordering:
  //   1. gen.pollinations.ai  — the new unified endpoint. Browser auth is via
  //      Referer once this app's domain is registered at enter.pollinations.ai.
  //   2. image.pollinations.ai — the legacy public mirror; serves anonymously.
  //      Used as a fallback so the demo works for first-time visitors before
  //      the app domain is registered.
  const GEN_BASE = 'https://gen.pollinations.ai/image';
  const LEGACY_BASE = 'https://image.pollinations.ai/prompt';
  const REFERRER = 'pollinations-image-demo';

  const $ = (id) => document.getElementById(id);
  const promptEl = $('prompt');
  const modelEl = $('model');
  const widthEl = $('width');
  const heightEl = $('height');
  const goBtn = $('go');
  const resultEl = $('result');

  function buildUrl(base, prompt, model, w, h) {
    const params = new URLSearchParams({
      model,
      width: String(w),
      height: String(h),
      nologo: 'true',
      enhance: 'false',
      referrer: REFERRER,
    });
    return `${base}/${encodeURIComponent(prompt)}?${params}`;
  }

  function showLoading(url) {
    resultEl.innerHTML = `
      <div class="spinner"></div>
      <p class="placeholder">Generating… (typically 5–20 s)</p>
      <p class="meta">${url}</p>`;
  }

  function showImage(blobUrl, sourceUrl, sourceLabel) {
    resultEl.innerHTML = `
      <img src="${blobUrl}" alt="Generated image">
      <p class="meta">via ${sourceLabel} · ${sourceUrl}</p>`;
  }

  function showError(message, url) {
    resultEl.innerHTML = `
      <p class="error">⚠️ ${message}</p>
      <p class="meta">${url || ''}</p>
      <p class="placeholder">Try a shorter prompt or different model. If this persists, sign in at <a href="https://enter.pollinations.ai" target="_blank" rel="noopener" style="color:var(--accent-hover)">enter.pollinations.ai</a>.</p>`;
  }

  async function fetchImage(base, label, prompt, model, w, h) {
    const url = buildUrl(base, prompt, model, w, h);
    const res = await fetch(url, { method: 'GET' });
    if (!res.ok) {
      return { ok: false, status: res.status, url, label };
    }
    const blob = await res.blob();
    return { ok: true, blobUrl: URL.createObjectURL(blob), url, label };
  }

  async function generate() {
    const prompt = promptEl.value.trim();
    if (!prompt) {
      showError('Please enter a prompt.');
      return;
    }
    const model = modelEl.value;
    const w = Math.max(64, Math.min(2048, parseInt(widthEl.value, 10) || 1024));
    const h = Math.max(64, Math.min(2048, parseInt(heightEl.value, 10) || 1024));

    goBtn.disabled = true;
    showLoading(buildUrl(GEN_BASE, prompt, model, w, h));

    try {
      // 1. Try the new gen.pollinations.ai endpoint first.
      let result = await fetchImage(GEN_BASE, 'gen.pollinations.ai', prompt, model, w, h);
      // 2. Fall back to legacy anonymous endpoint on auth/rate failures.
      if (!result.ok && [401, 402, 403, 429].includes(result.status)) {
        showLoading(buildUrl(LEGACY_BASE, prompt, model, w, h));
        result = await fetchImage(LEGACY_BASE, 'image.pollinations.ai (anonymous)', prompt, model, w, h);
      }
      if (!result.ok) {
        throw new Error(`HTTP ${result.status} from both endpoints`);
      }
      showImage(result.blobUrl, result.url, result.label);
    } catch (err) {
      showError(err.message || String(err));
    } finally {
      goBtn.disabled = false;
    }
  }

  goBtn.addEventListener('click', generate);
  promptEl.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generate();
  });
})();
</script>

</body>
</html>
